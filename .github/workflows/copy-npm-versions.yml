name: Copy npm versions to GitHub Packages

# Decision: Zack moved publishing to GitHub Packages on 2026-11-25. Apps still pin versions that only exist on npm,
# so this copies each npm version that's missing on GitHub Packages, without moving the latest tag.
# create-bwf was unscoped on npm, and GitHub Packages only takes scoped names, so its old versions stay on npm.

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_USERCONFIG: /tmp/github-packages.npmrc
      REGISTRY: https://npm.pkg.github.com
      NPM: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - run: npm install -g npm@11
      - name: Sign in to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"
      - name: Copy missing versions
        working-directory: ${{ runner.temp }}
        run: |
          for f in "$GITHUB_WORKSPACE"/packages/*/package.json; do
            [ "$(node -p "require('$f').private === true")" = true ] && continue
            name=$(node -p "require('$f').name")
            for v in $(npm view "$name" versions --json --registry "$NPM" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=s?JSON.parse(s):[];console.log([].concat(v).filter(x=>typeof x==='string').join(' '))})"); do
              if npm view "$name@$v" version --registry "$REGISTRY" >/dev/null 2>&1; then
                continue
              fi
              tarball=$(npm pack "$name@$v" --registry "$NPM" --silent | tail -1)
              echo "Copying $name@$v"
              npm publish "./$tarball" --registry "$REGISTRY" --tag npm-copy --ignore-scripts
              rm "$tarball"
            done
          done
