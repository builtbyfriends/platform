name: Publish

on:
  push:
    tags:
      - 'v*'
    # Decision: Zack asked on 2026-11-25 for releases to start from a version bump on main, since agent sessions
    # can't push tags. A bump with no matching tag yet releases that version and tags it at the end.
    branches: [main]
    paths:
      - 'packages/bwf/package.json'
      - '.github/workflows/publish.yml'

permissions: {}

jobs:
  release-tag:
    name: Find the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      production: ${{ steps.production.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Decision: the tag job can't tag a release commit that changes a workflow, since the workflow's token
      # may not touch workflow files. So a version already on GitHub Packages counts as released, tagged or not.
      - id: tag
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p "require('./packages/bwf/package.json').version")"
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged, so there's nothing to release."
          elif NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" npm view "@builtbyfriends/bwf@${tag#v}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${tag#v} is already on GitHub Packages, so there's nothing to release."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      # Decision: Zack chose on 2026-11-25 to run the production schema check only once platform has a
      # production deployment here. Before that there's no deployed schema to compare with.
      - id: production
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_ENVIRONMENT: ${{ vars.PLATFORM_PRODUCTION_ENV || 'Prod' }}
          PRODUCTION_REF: ${{ vars.PLATFORM_PRODUCTION_REF }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$PRODUCTION_ENVIRONMENT&per_page=1" --jq length)
          if [ -n "$PRODUCTION_REF" ] || [ "$count" != 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Platform has no production deployment yet, so the release skips the schema check."
          fi

  validate-release:
    name: Validate release tag
    needs: release-tag
    if: needs.release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: false
      - name: Validate package versions and release channel
        run: node .github/scripts/release-policy.ts

  # Decision: Head of Code asked on 2026-11-26 to stop running the release checks again when the pull request already passed
  # them: a release took 7 to 12 minutes, and the publish itself took 1. The merged pull request's checks count when
  # every one of them passed and the files at its head are the same files as this commit. A push that comes from no
  # merged pull request, a head with different files from main, a failed lookup and a tag push still run the full checks. The push to main
  # still runs ci.yml for the Windows tests, and it doesn't hold the publish.
  reuse-checks:
    name: Reuse the pull request's checks
    needs: [release-tag, validate-release]
    if: needs.release-tag.outputs.tag != '' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/reuse-pr-checks.ts

  ci:
    needs: [validate-release, reuse-checks]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.reuse-checks.outputs.reuse != 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # ci.yml's build job requests an OIDC token for remote cache uploads, so its caller must
      # grant it, though release runs only download.
      id-token: write
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  platform-ci:
    needs: [release-tag, validate-release, reuse-checks]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.reuse-checks.outputs.reuse != 'true' }}
    uses: ./.github/workflows/platform-ci.yml
    with:
      require-schema-compat: ${{ needs.release-tag.outputs.production == 'true' }}
    permissions:
      contents: read
      deployments: read
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  prepublish-test:
    name: Prepublish Test
    needs: [validate-release, reuse-checks]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.reuse-checks.outputs.reuse != 'true' }}
    uses: ./.github/workflows/prepublish-test.yml
    with:
      suite: full
      include_macos: true
    permissions:
      contents: read
      pull-requests: read
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  # Decision: Zack moved our packages from npm to GitHub Packages on 2026-11-25. Each package's
  # publishConfig names the registry, and the workflow's own token publishes, so nothing is stored.
  publish:
    needs: [release-tag, reuse-checks, ci, platform-ci, prepublish-test]
    if: >-
      !cancelled() && needs.release-tag.outputs.tag != '' && (
      needs.reuse-checks.outputs.reuse == 'true' ||
      (needs.ci.result == 'success' && needs.platform-ci.result == 'success' && needs.prepublish-test.result == 'success'))
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM_SOURCE_REVISION: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/packages-auth
        with:
          token: ${{ secrets.PACKAGES_TOKEN }}
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Validate release versions and channel
        id: release
        run: node .github/scripts/release-policy.ts
      - run: vp run build

      - run: npm install -g npm@11
      # Decision: the install reads with PACKAGES_TOKEN. With the workflow's token in NODE_AUTH_TOKEN for the
      # whole job, the install got a 403 on Realtime, which this repository's token can't read. So only the
      # publish steps get the workflow's token, in a config of their own.
      - name: Sign in to GitHub Packages
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/github-packages.npmrc
        run: echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"
      - name: Publish packages
        env:
          RELEASE_NPM_TAG: ${{ steps.release.outputs.npm-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/github-packages.npmrc
        run: vp pm publish -r --tag "$RELEASE_NPM_TAG" --no-git-checks

  tag-release:
    name: Tag the release
    if: github.ref_type == 'branch'
    needs: [release-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
