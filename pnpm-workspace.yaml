packages:
  - docs
  - packages/*
  - platform
  - platform/packages/*
  - playground/*

catalogMode: strict

allowBuilds:
  '@astryxdesign/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  core-js-pure: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@cloudflare/workers-types': ^5.20261121.1
  '@cloudflare/workers-utils': ^0.56.0
  '@types/node': ^26.6.6
  '@voidzero-dev/vite-plus-prompts': 1.7.0
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  wrangler: ^4.166.0
  cf: 1.0.0-rc.2
  oauth4webapi: ^3.8.9
  '@astryxdesign/core': 0.7.17
  '@astryxdesign/theme-neutral': 0.7.17
  '@stylexjs/stylex': 0.19.2
  # Exact: the Vite plugin, cf, the config schema and the output reader move together.
  # A newer one of these can write or expect output the others can't read.
  '@cloudflare/build-output-utils': 1.0.0-rc.3
  '@cloudflare/codemods': ^0.9.0
  '@cloudflare/config': 1.0.0-rc.3
  '@cloudflare/vite-plugin': 2.0.0-rc.3
  '@cloudflare/workers-auth': ^0.18.6
  '@nkzw/fate': 2.2.5
  '@vitejs/plugin-react': ^6.3.0
  magic-string: ^1.4.5
  # Keep Miniflare aligned with the Vite plugin, Wrangler, and cf.
  miniflare: 5.20261119.0-beta
  playwright: ^1.65.1
  postal-mime: ^4.2.1
  react-fate: 2.2.5
  reka-ui: 2.11.0
  rolldown: ^1.3.3
  shiki: ^4.6.0
  '@electric-sql/pglite': 0.5.17
  better-auth: ^1.7.27
  lucide-react: 1.77.0
  react: ^19.3.1
  react-dom: ^19.3.1
  vitepress-plugin-group-icons: ^1.8.2
  vitepress-plugin-llms: ^1.15.0
  '@cloudflare/sandbox': ^1.0.3
  '@napi-rs/keyring': ^2.1.2
  '@iconify/vue': 5.0.5
  arktype: ^2.2.10
  cron-parser: 5.10.6
  hono: ^4.13.19
  ignore: ^7.0.16
  jose: 6.2.18
  mime: ^4.1.2
  smol-toml: ^1.9.1
  minimatch: ^11.0.9
  vue: ^3.5.46
  ci-info: ^4.5.0
  '@types/react-dom': ^19.3.0
  happy-dom: 21.0.4
  eslint-plugin-react-you-might-not-need-an-effect: 1.3.1
  '@cloudflare/oxlint-config': 0.1.0
  '@aranlucas/oxlint-plugin-anti-slop': 0.1.1
  oxlint-plugin-react-doctor: 0.9.23
  tsrs: 0.25.0-ts7.1.0-beta

catalogs:
  platform:
    '@cloudflare/workers-types': ^5.20261121.1
    hono: 4.13.19
    wrangler: ^4.166.0

overrides:
  # Keep Vite+'s pinned Vitest internals on the same patch as the runner.
  '@vitest/mocker': 5.1.0
  '@vitest/pretty-format': 5.1.0
  '@vitest/snapshot': 5.1.0
  '@vitest/spy': 5.1.0
  '@vitest/utils': 5.1.0
  esbuild: ^0.28.2
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

# No release-age hold: take new versions as soon as they are published.
minimumReleaseAge: 0
